<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pegasus Representações - Cigarros e Sedas Premium">
    
    <meta property="og:title" content="PEGASUS REPRESENTAÇÕES">
    <meta property="og:description" content="Cigarros e Sedas de qualidade!">
    <meta property="og:image" content="https://i.ibb.co/KxncsGgR/ZMUGd.jpg">

    <title>PEGASUS REPRESENTAÇÕES</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" href="https://i.ibb.co/KxncsGgR/ZMUGd.jpg">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap');
        
        .product-card {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .product-img {
            height: 200px;
            object-fit: contain;
            background: transparent;
            padding: 15px;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.5));
        }
        .logo-img {
            width: 42px;
            height: 42px;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 bg-black border-b border-zinc-800">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-2">
                    <img src="https://i.ibb.co/KxncsGgR/ZMUGd.jpg" alt="Logo" class="logo-img rounded-2xl border border-[#d4af77]">
                    <div>
                        <h1 class="text-2xl font-bold text-[#d4af77]">PEGASUS</h1>
                        <p class="text-[10px] text-zinc-400 -mt-1">REPRESENTAÇÕES</p>
                    </div>
                </div>
                
                <button onclick="toggleCart()" class="flex items-center gap-2 bg-zinc-900 px-4 py-2 rounded-3xl relative">
                    <i class="fa-solid fa-shopping-cart text-xl"></i>
                    <span class="text-sm">Carrinho</span>
                    <div id="cart-count" class="bg-[#d4af77] text-black font-bold w-5 h-5 text-xs rounded-full flex items-center justify-center absolute -top-1 -right-1">0</div>
                </button>
            </div>
        </div>

        <!-- CATEGORIAS -->
        <div class="bg-zinc-900 px-4 py-3 flex gap-2 overflow-x-auto border-t border-zinc-800">
            <button onclick="selectCategory('all')" id="cat-all" 
                    class="category-btn active whitespace-nowrap px-6 py-2.5 bg-[#d4af77] text-black font-semibold rounded-3xl text-sm">TODOS</button>
            <button onclick="selectCategory('CIGARROS')" id="cat-CIGARROS" 
                    class="category-btn whitespace-nowrap px-6 py-2.5 hover:bg-zinc-800 rounded-3xl text-sm">CIGARROS</button>
            <button onclick="selectCategory('SEDAS')" id="cat-SEDAS" 
                    class="category-btn whitespace-nowrap px-6 py-2.5 hover:bg-zinc-800 rounded-3xl text-sm">SEDAS</button>
        </div>
    </header>

    <!-- Busca -->
    <div class="max-w-7xl mx-auto px-4 pt-5">
        <div class="relative">
            <input id="search-input" type="text" placeholder="🔎 Buscar..." 
                   class="w-full bg-zinc-900 border border-zinc-700 rounded-3xl py-4 px-8 pl-12 text-base"
                   onkeyup="if(event.key === 'Enter') filterProducts()">
            <i onclick="filterProducts()" class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-[#d4af77]"></i>
        </div>
    </div>

    <!-- Produtos -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <div id="products-container" class="grid grid-cols-2 gap-4"></div>
    </main>

    <!-- Carrinho Modal -->
    <div id="cart-modal" class="hidden fixed inset-0 bg-black/90 z-[100] flex items-end">
        <div class="bg-zinc-900 w-full rounded-t-3xl max-h-[90vh] flex flex-col">
            <div class="p-5 border-b flex justify-between items-center">
                <h2 class="text-xl font-semibold">Seu Carrinho</h2>
                <button onclick="toggleCart()" class="text-3xl text-zinc-400">✕</button>
            </div>
            <div id="cart-items" class="flex-1 overflow-auto p-5 space-y-4"></div>
            
            <div class="p-5 border-t">
                <div class="flex justify-between text-xl mb-5">
                    <span>Total:</span>
                    <span id="cart-total" class="font-bold text-[#d4af77]">R$ 0,00</span>
                </div>
                <button onclick="finalizeOrder()" 
                        class="w-full py-5 bg-green-600 hover:bg-green-500 rounded-3xl text-lg font-semibold flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp"></i>
                    FINALIZAR NO WHATSAPP
                </button>
            </div>
        </div>
    </div>

    <footer class="bg-black py-6 text-center">
        <a href="https://wa.me/5527995065360" target="_blank"
           class="inline-flex items-center gap-2 bg-green-500 hover:bg-green-600 text-white px-8 py-4 rounded-3xl text-base font-medium">
            <i class="fa-brands fa-whatsapp text-2xl"></i>
            FALAR COM VENDEDOR
        </a>
    </footer>

    <script>
        const products = [
            { id: 1, name: "CAMEL AZUL (PC10)", category: "CIGARROS", price: 85, img: "https://i.ibb.co/PGPFZ8Mk/Whats-App-Image-2026-05-01-at-06-40-26-removebg-preview.png" },
            { id: 10, name: "CAMEL BERRY CRAVO (PC10)", category: "CIGARROS", price: 85, img: "https://i.ibb.co/Q3Wkg1XY/Whats-App-Image-2026-04-29-at-22-16-35-1-removebg-preview.png" },
            { id: 2, name: "DUNHILL (PC10)", category: "CIGARROS", price: 138, img: "https://i.ibb.co/HDx9LsC7/Whats-App-Image-2026-04-28-at-07-45-51-2-removebg-preview.png" },
            { id: 8, name: "EGIPT BOX (PC10)", category: "CIGARROS", price: 30, img: "https://i.ibb.co/rfzskyJZ/Whats-App-Image-2026-04-30-at-21-30-20.jpg" },
            { id: 5, name: "LUCK STRIKE DOUBLE (PC10)", category: "CIGARROS", price: 126, img: "https://i.ibb.co/nqypTnPM/Gemini-Generated-Image-vf6vzwvf6vzwvf6v-removebg-preview.png" },
            { id: 15, name: "OUTBACK (PC10)", category: "CIGARROS", price: 40, img: "https://i.ibb.co/Q3Wkg1XY/Whats-App-Image-2026-04-29-at-22-16-35-1-removebg-preview.png" },
            { id: 6, name: "PANDORA AZUL BOX (PC10)", category: "CIGARROS", price: 35, img: "https://i.ibb.co/99KbNCKd/Gemini-Generated-Image-sl0unfsl0unfsl0u-1-removebg-preview.png" },
            { id: 7, name: "PANDORA MAÇO (PC10)", category: "CIGARROS", price: 30, img: "https://i.ibb.co/dJtMbwzd/Gemini-Generated-Image-1hdpoo1hdpoo1hdp-removebg-preview.png" },
            { id: 13, name: "PANDORA BOX VERMELHO (PC10)", category: "CIGARROS", price: 35, img: "https://i.ibb.co/C5Mg0mXq/Gemini-Generated-Image-nm7ovrnm7ovrnm7o-removebg-preview-1.png" },
            { id: 14, name: "PANDORA BOX MENTA (PC10)", category: "CIGARROS", price: 35, img: "https://i.ibb.co/XZFdtgXP/Gemini-Generated-Image-iur4raiur4raiur4-removebg-preview.png" },
            { id: 3, name: "ROTHMANS GLOBAL (PC10)", category: "CIGARROS", price: 79, img: "https://i.ibb.co/zT1D7VRG/u7-UTD-removebg-preview-1.png" },
            { id: 2, name: "ROTHMANS AZUL (PC10)", category: "CIGARROS", price: 95, img: "https://i.ibb.co/zW4ZJRBY/ROTHMANS-BLUE-BOX-380x380.png" },
            { id: 4, name: "ROTHMANS VERMELHO (PC10)", category: "CIGARROS", price: 95, img: "https://i.ibb.co/d4y0X5B2/188065-800-800.png" },
            { id: 9, name: "TOP TIM BOX (PC10)", category: "CIGARROS", price: 30, img: "https://i.ibb.co/hkMc1CP/Whats-App-Image-2026-05-01-at-06-33-04-removebg-preview.png" },
            
            // SEDAS
            { id: 11, name: "ZOMO BRANCA", category: "SEDAS", price: 50, img: "https://i.ibb.co/dsRJMd3z/caixa-de-seda-zomo-perfect-black-king-size-c-50-un-tabacaria-2485-1-26e93c3766a013b7cdb8d9b67dd4ecdb.jpg" },
            { id: 12, name: "ZOMO MARROM", category: "SEDAS", price: 50, img: "https://i.ibb.co/2rjLpx7/caixa-de-seda-zomo-brown-natural-perfect-king-size-c-50-1973-1-55dac4193e3886323d0e97fb0fe27e55.jpg" }
        ]

        let cart = []
        let currentCategory = 'all'

        function renderProducts(filtered) {
            const container = document.getElementById('products-container')
            container.innerHTML = ''

            filtered.forEach(p => {
                const card = `
                <div class="product-card bg-zinc-900 rounded-3xl overflow-hidden border border-zinc-800">
                    <img src="${p.img}" class="product-img w-full">
                    <div class="p-3.5 flex-1 flex flex-col">
                        <h3 class="font-semibold text-base leading-tight">${p.name}</h3>
                        <p class="text-[#d4af77] text-2xl font-bold mt-1">R$ ${p.price},00</p>
                        
                        <div class="mt-auto pt-4 flex gap-2">
                            <input type="number" id="qty-${p.id}" value="1" min="1" 
                                   class="w-14 bg-zinc-800 text-center rounded-2xl text-base py-3 border border-zinc-700">
                            <button onclick="addToCart(${p.id})" 
                                    class="flex-1 bg-[#d4af77] hover:bg-amber-300 text-zinc-950 font-semibold rounded-2xl text-sm py-3">
                                ADICIONAR
                            </button>
                        </div>
                    </div>
                </div>`
                container.innerHTML += card
            })
        }

        function filterProducts() {
            const term = document.getElementById('search-input').value.toLowerCase()
            let filtered = products.filter(p => 
                (currentCategory === 'all' || p.category === currentCategory) &&
                p.name.toLowerCase().includes(term)
            )
            renderProducts(filtered)
        }

        function selectCategory(cat) {
            currentCategory = cat
            document.querySelectorAll('.category-btn').forEach(btn => {
                const isActive = (cat === 'all' && btn.id === 'cat-all') || btn.id === `cat-${cat}`
                btn.classList.toggle('active', isActive)
                btn.classList.toggle('bg-[#d4af77]', isActive)
                btn.classList.toggle('text-black', isActive)
            })
            filterProducts()
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id)
            const qty = parseInt(document.getElementById(`qty-${id}`).value) || 1
            const existing = cart.find(item => item.id === id)
            if (existing) existing.quantity += qty
            else cart.push({ ...product, quantity: qty })

            updateCartCount()
            
            const toast = document.createElement('div')
            toast.className = "fixed bottom-6 left-1/2 -translate-x-1/2 bg-green-600 text-white px-6 py-3 rounded-3xl shadow-2xl z-[999]"
            toast.textContent = `${qty}x ${product.name} adicionado!`
            document.body.appendChild(toast)
            setTimeout(() => toast.remove(), 1800)
        }

        function updateCartCount() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0)
            document.getElementById('cart-count').textContent = count
        }

        function renderCart() {
            const container = document.getElementById('cart-items')
            container.innerHTML = ''

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-center text-zinc-400 py-12">Seu carrinho está vazio</p>`
                document.getElementById('cart-total').textContent = 'R$ 0,00'
                return
            }

            let total = 0
            cart.forEach(item => {
                const itemTotal = item.price * item.quantity
                total += itemTotal
                container.innerHTML += `
                <div class="flex gap-4 bg-zinc-800 rounded-2xl p-4">
                    <img src="${item.img}" class="w-16 h-16 object-contain rounded-xl">
                    <div class="flex-1">
                        <div class="flex justify-between">
                            <h4 class="font-semibold">${item.name}</h4>
                            <button onclick="removeFromCart(${item.id})" class="text-red-500"><i class="fa-solid fa-trash"></i></button>
                        </div>
                        <p class="text-sm text-zinc-400">${item.quantity} × R$ ${item.price},00</p>
                        <p class="text-[#d4af77] font-bold">R$ ${itemTotal},00</p>
                    </div>
                </div>`
            })
            document.getElementById('cart-total').textContent = `R$ ${total},00`
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id)
            updateCartCount()
            renderCart()
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal')
            modal.classList.toggle('hidden')
            if (!modal.classList.contains('hidden')) renderCart()
        }

        function finalizeOrder() {
            if (cart.length === 0) return
            let msg = `🚀 *PEDIDO PEGASUS REPRESENTAÇÕES*\n\n`
            let total = 0
            cart.forEach(item => {
                const sub = item.price * item.quantity
                total += sub
                msg += `${item.quantity}x ${item.name} → R$ ${sub},00\n`
            })
            msg += `\n*TOTAL: R$ ${total},00*`
            window.open(`https://wa.me/5527995065360?text=${encodeURIComponent(msg)}`, '_blank')
            cart = []
            updateCartCount()
            toggleCart()
        }

        window.onload = () => {
            renderProducts(products)
            updateCartCount()
        }
    </script>
</body>
</html>
