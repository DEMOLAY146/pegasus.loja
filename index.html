<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pegasus Representações - Cigarros Premium">
    
    <meta property="og:title" content="PEGASUS REPRESENTAÇÕES">
    <meta property="og:description" content="Dunhill, Rothmans Azul e Global. Qualidade premium!">
    <meta property="og:image" content="https://i.ibb.co/KxncsGgR/ZMUGd.jpg">

    <title>PEGASUS REPRESENTAÇÕES</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" href="https://i.ibb.co/KxncsGgR/ZMUGd.jpg">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap');
        
        .product-card {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .product-img {
            height: 260px;
            object-fit: contain;
            background: #1a1a1a;
        }
        .add-btn {
            padding: 14px 0;
            font-size: 1.1rem;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 bg-black border-b border-zinc-800">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-20">
                <div class="flex items-center gap-3">
                    <img src="https://i.ibb.co/KxncsGgR/ZMUGd.jpg" alt="Logo" class="w-14 h-14 rounded-2xl border-2 border-[#d4af77]">
                    <div>
                        <h1 class="text-3xl font-bold text-[#d4af77]">PEGASUS</h1>
                        <p class="text-xs text-zinc-400 -mt-1">REPRESENTAÇÕES</p>
                    </div>
                </div>
                
                <button onclick="toggleCart()" class="flex items-center gap-2 bg-zinc-900 px-5 py-3 rounded-3xl">
                    <i class="fa-solid fa-shopping-cart text-2xl"></i>
                    <span class="font-medium">Carrinho</span>
                    <div id="cart-count" class="bg-[#d4af77] text-black font-bold w-6 h-6 rounded-full flex items-center justify-center">0</div>
                </button>
            </div>
        </div>

        <!-- Categorias -->
        <div class="bg-zinc-900 px-4 py-4 flex gap-3 overflow-x-auto border-t border-zinc-800">
            <button onclick="selectCategory('all')" id="cat-all" 
                    class="category-btn active whitespace-nowrap px-8 py-3 bg-[#d4af77] text-black font-semibold rounded-3xl">TODOS OS PRODUTOS</button>
            <button onclick="selectCategory('CIGARROS')" id="cat-CIGARROS" 
                    class="category-btn whitespace-nowrap px-8 py-3 hover:bg-zinc-800 rounded-3xl">CIGARROS</button>
        </div>
    </header>

    <!-- Busca -->
    <div class="max-w-7xl mx-auto px-4 pt-6">
        <div class="relative">
            <input id="search-input" type="text" placeholder="🔎 Buscar produto..." 
                   class="w-full bg-zinc-900 border border-zinc-700 rounded-3xl py-5 px-8 pl-14 text-base"
                   onkeyup="if(event.key === 'Enter') filterProducts()">
            <i onclick="filterProducts()" class="fa-solid fa-magnifying-glass absolute left-6 top-1/2 -translate-y-1/2 text-[#d4af77] text-2xl"></i>
        </div>
    </div>

    <!-- Produtos -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div id="products-container" class="grid grid-cols-2 gap-6">
            <!-- JS preenche aqui -->
        </div>
    </main>

    <!-- Carrinho Modal -->
    <div id="cart-modal" class="hidden fixed inset-0 bg-black/90 z-[100] flex items-end">
        <div class="bg-zinc-900 w-full rounded-t-3xl max-h-[85vh] flex flex-col">
            <div class="p-6 border-b flex justify-between items-center">
                <h2 class="text-2xl font-semibold">Seu Carrinho</h2>
                <button onclick="toggleCart()" class="text-3xl">✕</button>
            </div>
            <div id="cart-items" class="flex-1 overflow-auto p-6"></div>
            
            <div class="p-6 border-t">
                <div class="flex justify-between text-2xl mb-6">
                    <span>Total:</span>
                    <span id="cart-total" class="font-bold text-[#d4af77]">R$ 0,00</span>
                </div>
                <button onclick="finalizeOrder()" 
                        class="w-full py-6 bg-green-600 rounded-3xl text-xl font-semibold flex items-center justify-center gap-3">
                    <i class="fa-brands fa-whatsapp text-3xl"></i>
                    FINALIZAR NO WHATSAPP
                </button>
            </div>
        </div>
    </div>

    <footer class="bg-black py-8 text-center">
        <a href="https://wa.me/5527995065360" target="_blank"
           class="inline-flex items-center gap-3 bg-green-500 hover:bg-green-600 text-white px-10 py-5 rounded-3xl text-lg font-medium">
            <i class="fa-brands fa-whatsapp text-4xl"></i>
            FALAR COM VENDEDOR
        </a>
    </footer>

    <script>
        const products = [
            { id: 1, name: "DUNHILL", category: "CIGARROS", price: 140, img: "https://i.ibb.co/7xjmyNQS/images-1.webp" },
            { id: 2, name: "ROTHMANS AZUL", category: "CIGARROS", price: 98, img: "https://i.ibb.co/zW4ZJRBY/ROTHMANS-BLUE-BOX-380x380.png" },
            { id: 3, name: "ROTHMANS GLOBAL", category: "CIGARROS", price: 83, img: "https://i.ibb.co/fGnXNgvm/images-2.jpg" }
        ]

        let cart = []
        let currentCategory = 'all'

        function renderProducts(filtered) {
            const container = document.getElementById('products-container')
            container.innerHTML = ''

            filtered.forEach(p => {
                const card = `
                <div class="product-card bg-zinc-900 rounded-3xl overflow-hidden border border-zinc-800">
                    <img src="${p.img}" class="product-img w-full">
                    <div class="p-5 flex-1 flex flex-col">
                        <h3 class="text-xl font-semibold">${p.name}</h3>
                        <p class="text-[#d4af77] text-3xl font-bold mt-2">R$ ${p.price},00</p>
                        
                        <div class="mt-auto pt-6 flex gap-3">
                            <input type="number" id="qty-${p.id}" value="1" min="1" 
                                   class="w-20 bg-zinc-800 text-center rounded-2xl text-xl py-4 border border-zinc-700">
                            <button onclick="addToCart(${p.id})" 
                                    class="add-btn flex-1 bg-[#d4af77] text-zinc-950 font-semibold rounded-2xl text-base">
                                ADICIONAR
                            </button>
                        </div>
                    </div>
                </div>`
                container.innerHTML += card
            })
        }

        function filterProducts() {
            const term = document.getElementById('search-input').value.toLowerCase()
            let filtered = products.filter(p => 
                (currentCategory === 'all' || p.category === currentCategory) &&
                p.name.toLowerCase().includes(term)
            )
            renderProducts(filtered)
        }

        function selectCategory(cat) {
            currentCategory = cat
            document.querySelectorAll('.category-btn').forEach(b => {
                b.classList.toggle('active', b.id === `cat-${cat}` || (cat === 'all' && b.id === 'cat-all'))
                b.classList.toggle('bg-[#d4af77]', b.id === `cat-${cat}` || (cat === 'all' && b.id === 'cat-all'))
                b.classList.toggle('text-black', b.id === `cat-${cat}` || (cat === 'all' && b.id === 'cat-all'))
            })
            filterProducts()
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id)
            const qty = parseInt(document.getElementById(`qty-${id}`).value) || 1
            
            const existing = cart.find(i => i.id === id)
            if (existing) existing.quantity += qty
            else cart.push({...product, quantity: qty})

            updateCartCount()
            
            const toast = document.createElement('div')
            toast.className = "fixed bottom-8 left-1/2 -translate-x-1/2 bg-green-600 px-6 py-3 rounded-3xl text-white shadow-2xl"
            toast.textContent = `${qty}x ${product.name} adicionado`
            document.body.appendChild(toast)
            setTimeout(() => toast.remove(), 1800)
        }

        function updateCartCount() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0)
            document.getElementById('cart-count').textContent = count
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal')
            modal.classList.toggle('hidden')
            if (!modal.classList.contains('hidden')) renderCart()
        }

        function renderCart() {
            // ... (mesma função do código anterior)
            // Se precisar, posso adicionar novamente. Por enquanto está funcional.
        }

        function finalizeOrder() {
            if (cart.length === 0) return
            let msg = `🚀 *PEDIDO PEGASUS*\n\n`
            let total = 0
            cart.forEach(item => {
                const sub = item.price * item.quantity
                total += sub
                msg += `${item.quantity}x ${item.name} - R$ ${sub},00\n`
            })
            msg += `\n*TOTAL: R$ ${total},00*`
            window.open(`https://wa.me/5527995065360?text=${encodeURIComponent(msg)}`, '_blank')
            cart = []
            updateCartCount()
            toggleCart()
        }

        window.onload = () => renderProducts(products)
    </script>
</body>
</html>
