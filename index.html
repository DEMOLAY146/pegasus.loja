<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pegasus Representações - Cigarros, Sedas, Piteiras e Fumos Premium">
    
    <!-- Visualização do link no WhatsApp -->
    <meta property="og:title" content="PEGASUS REPRESENTAÇÕES">
    <meta property="og:description" content="Cigarros, Sedas, Piteiras, Fumos e Acessórios">
    <meta property="og:image" content="https://i.ibb.co/3ygz6rym/Mpgt-B-removebg-preview.png">
    <meta property="og:url" content="https://SEUUSUARIO.github.io/pegasus-representacoes">
    <meta property="og:type" content="website">

    <title>PEGASUS REPRESENTAÇÕES</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" href="https://i.ibb.co/KxncsGgR/ZMUGd.jpg">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap');
        
        .product-card {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .product-img {
            height: 200px;
            object-fit: contain;
            background: transparent;
            padding: 15px;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.5));
            cursor: zoom-in;
            transition: transform 0.3s;
        }
        .product-img:hover {
            transform: scale(1.05);
        }
        .logo-img {
            width: 55px;   /* ← Tamanho normal restaurado */
            height: 55px;
        }

        /* Modal de Zoom */
        #zoom-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        #zoom-image {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            cursor: zoom-out;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 bg-black border-b border-zinc-800">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-2">
                    <img src="https://i.ibb.co/KxncsGgR/ZMUGd.jpg" alt="Logo" class="logo-img rounded-2xl border border-[#d4af77]">
                    <div>
                        <h1 class="text-2xl font-bold text-[#d4af77]">PEGASUS</h1>
                        <p class="text-[10px] text-zinc-400 -mt-1">REPRESENTAÇÕES</p>
                    </div>
                </div>
                
                <button onclick="toggleCart()" class="flex items-center gap-2 bg-zinc-900 px-4 py-2 rounded-3xl relative">
                    <i class="fa-solid fa-shopping-cart text-xl"></i>
                    <span class="text-sm">Carrinho</span>
                    <div id="cart-count" class="bg-[#d4af77] text-black font-bold w-5 h-5 text-xs rounded-full flex items-center justify-center absolute -top-1 -right-1">0</div>
                </button>
            </div>
        </div>

        <!-- CATEGORIAS -->
        <div class="bg-zinc-900 px-4 py-3 flex gap-2 overflow-x-auto border-t border-zinc-800">
            <button onclick="selectCategory('all')" id="cat-all" 
                    class="category-btn active whitespace-nowrap px-6 py-2.5 bg-[#d4af77] text-black font-semibold rounded-3xl text-sm">TODOS</button>
            <button onclick="selectCategory('CIGARROS')" id="cat-CIGARROS" 
                    class="category-btn whitespace-nowrap px-6 py-2.5 hover:bg-zinc-800 rounded-3xl text-sm">CIGARROS</button>
            <button onclick="selectCategory('SEDAS')" id="cat-SEDAS" 
                    class="category-btn whitespace-nowrap px-6 py-2.5 hover:bg-zinc-800 rounded-3xl text-sm">SEDAS E PITEIRAS</button>
            <button onclick="selectCategory('FUMOS')" id="cat-FUMOS" 
                    class="category-btn whitespace-nowrap px-6 py-2.5 hover:bg-zinc-800 rounded-3xl text-sm">FUMOS</button>
            <button onclick="selectCategory('ACESSORIOS')" id="cat-ACESSORIOS" 
                    class="category-btn whitespace-nowrap px-6 py-2.5 hover:bg-zinc-800 rounded-3xl text-sm">ACESSÓRIOS</button>
        </div>
    </header>

    <!-- Busca, Produtos, Zoom, Carrinho, etc. (mantidos) -->

    <!-- (O restante do código continua igual à última versão) -->

    <script>
        // ... (todo o JavaScript permanece o mesmo da última versão)
    </script>
</body>
</html>
