<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pegasus Representações - Cigarros, Sedas, Piteiras e Fumos Premium">
    
    <!-- Visualização do link no WhatsApp -->
    <meta property="og:title" content="PEGASUS REPRESENTAÇÕES">
    <meta property="og:description" content="Cigarros, Sedas, Piteiras, Fumos e Acessórios">
    <meta property="og:image" content="https://i.ibb.co/3ygz6rym/Mpgt-B-removebg-preview.png">
    <meta property="og:url" content="https://SEUUSUARIO.github.io/pegasus-representacoes">
    <meta property="og:type" content="website">

    <title>PEGASUS REPRESENTAÇÕES</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" href="https://i.ibb.co/KxncsGgR/ZMUGd.jpg">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap');
        
        .product-card {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .product-img {
            height: 200px;
            object-fit: contain;
            background: transparent;
            padding: 15px;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.5));
            cursor: zoom-in;
            transition: transform 0.3s;
        }
        .product-img:hover {
            transform: scale(1.05);
        }

        /* Modal de Zoom */
        #zoom-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        #zoom-image {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            cursor: zoom-out;
        }

        /* Alerta Personalizado */
        #alert-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 300;
            align-items: center;
            justify-content: center;
        }
        #alert-box {
            background: #1f2937;
            border: 2px solid #eab308;
            max-width: 380px;
            padding: 30px 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 bg-black border-b border-zinc-800">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-2">
                    <img src="https://i.ibb.co/KxncsGgR/ZMUGd.jpg" alt="Logo" class="logo-img rounded-2xl border border-[#d4af77]">
                    <div>
                        <h1 class="text-2xl font-bold text-[#d4af77]">PEGASUS</h1>
                        <p class="text-[10px] text-zinc-400 -mt-1">REPRESENTAÇÕES</p>
                    </div>
                </div>
                
                <button onclick="toggleCart()" class="flex items-center gap-2 bg-zinc-900 px-4 py-2 rounded-3xl relative">
                    <i class="fa-solid fa-shopping-cart text-xl"></i>
                    <span class="text-sm">Carrinho</span>
                    <div id="cart-count" class="bg-[#d4af77] text-black font-bold w-5 h-5 text-xs rounded-full flex items-center justify-center absolute -top-1 -right-1">0</div>
                </button>
            </div>
        </div>

        <!-- CATEGORIAS -->
        <div class="bg-zinc-900 px-4 py-3 flex gap-2 overflow-x-auto border-t border-zinc-800">
            <button onclick="selectCategory('all')" id="cat-all" 
                    class="category-btn active whitespace-nowrap px-6 py-2.5 bg-[#d4af77] text-black font-semibold rounded-3xl text-sm">TODOS</button>
            <button onclick="selectCategory('CIGARROS')" id="cat-CIGARROS" 
                    class="category-btn whitespace-nowrap px-6 py-2.5 hover:bg-zinc-800 rounded-3xl text-sm">CIGARROS</button>
            <button onclick="selectCategory('SEDAS')" id="cat-SEDAS" 
                    class="category-btn whitespace-nowrap px-6 py-2.5 hover:bg-zinc-800 rounded-3xl text-sm">SEDAS E PITEIRAS</button>
            <button onclick="selectCategory('FUMOS')" id="cat-FUMOS" 
                    class="category-btn whitespace-nowrap px-6 py-2.5 hover:bg-zinc-800 rounded-3xl text-sm">FUMOS</button>
            <button onclick="selectCategory('ACESSORIOS')" id="cat-ACESSORIOS" 
                    class="category-btn whitespace-nowrap px-6 py-2.5 hover:bg-zinc-800 rounded-3xl text-sm">ACESSÓRIOS</button>
        </div>
    </header>

    <!-- Busca -->
    <div class="max-w-7xl mx-auto px-4 pt-5">
        <div class="relative">
            <input id="search-input" type="text" placeholder="🔎 Buscar..." 
                   class="w-full bg-zinc-900 border border-zinc-700 rounded-3xl py-4 px-8 pl-12 text-base"
                   onkeyup="if(event.key === 'Enter') filterProducts()">
            <i onclick="filterProducts()" class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-[#d4af77]"></i>
        </div>
    </div>

    <!-- Produtos -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <div id="products-container" class="grid grid-cols-2 gap-4"></div>
    </main>

    <!-- Modal de Zoom -->
    <div id="zoom-modal" onclick="closeZoom()">
        <img id="zoom-image" src="" onclick="event.stopImmediatePropagation(); closeZoom()">
    </div>

    <!-- Alerta Personalizado -->
    <div id="alert-modal" onclick="if(event.target === this) closeAlert()">
        <div id="alert-box" onclick="event.stopImmediatePropagation()">
            <p class="text-amber-400 text-lg font-medium leading-relaxed mb-6">
                ATENÇÃO<br><br>
                OS PREÇOS E ESTOQUE DA LOJA NÃO ESTÃO ATUALIZADOS!<br><br>
                PARA NÃO TER CORTE NO PEDIDO CONFIRME COM O VENDEDOR
            </p>
            <button onclick="closeAlert()" 
                    class="bg-[#d4af77] hover:bg-amber-300 text-black font-semibold px-10 py-3 rounded-3xl text-base">
                OK
            </button>
        </div>
    </div>

    <!-- Carrinho Modal -->
    <div id="cart-modal" class="hidden fixed inset-0 bg-black/90 z-[100] flex items-end">
        <div class="bg-zinc-900 w-full rounded-t-3xl max-h-[90vh] flex flex-col">
            <div class="p-5 border-b flex justify-between items-center">
                <h2 class="text-xl font-semibold">Seu Carrinho</h2>
                <button onclick="toggleCart()" class="text-3xl text-zinc-400">✕</button>
            </div>
            <div id="cart-items" class="flex-1 overflow-auto p-5 space-y-4"></div>
            
            <div class="p-5 border-t">
                <div class="flex justify-between text-xl mb-5">
                    <span>Total:</span>
                    <span id="cart-total" class="font-bold text-[#d4af77]">R$ 0,00</span>
                </div>
                <button onclick="finalizeOrder()" 
                        class="w-full py-5 bg-green-600 hover:bg-green-500 rounded-3xl text-lg font-semibold flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp"></i>
                    FINALIZAR NO WHATSAPP
                </button>
            </div>
        </div>
    </div>

    <!-- RODAPÉ -->
    <footer class="bg-black py-8 text-center">
        <a href="https://wa.me/5527995065360" target="_blank"
           class="inline-flex items-center gap-3 bg-green-500 hover:bg-green-600 text-white px-8 py-5 rounded-3xl text-lg font-medium shadow-xl">
            <i class="fa-brands fa-whatsapp text-3xl"></i>
            FALAR COM O VENDEDOR
        </a>
    </footer>

    <script>
        const products = [ /* ... todos os produtos permanecem iguais ... */ ];

        let cart = []
        let currentCategory = 'all'

        function renderProducts(filtered) {
            const container = document.getElementById('products-container')
            container.innerHTML = ''

            filtered.forEach(p => {
                const card = `
                <div class="product-card bg-zinc-900 rounded-3xl overflow-hidden border border-zinc-800">
                    <img src="${p.img}" class="product-img w-full" onclick="zoomImage('${p.img}')">
                    <div class="p-3.5 flex-1 flex flex-col">
                        <h3 class="font-semibold text-base leading-tight">${p.name}</h3>
                        <p class="text-[#d4af77] text-2xl font-bold mt-1">R$ ${p.price},00</p>
                        
                        <div class="mt-auto pt-4 flex gap-2">
                            <input type="number" id="qty-${p.id}" value="1" min="1" 
                                   class="w-14 bg-zinc-800 text-center rounded-2xl text-base py-3 border border-zinc-700">
                            <button onclick="addToCart(${p.id})" 
                                    class="flex-1 bg-[#d4af77] hover:bg-amber-300 text-zinc-950 font-semibold rounded-2xl text-sm py-3">
                                ADICIONAR
                            </button>
                        </div>
                    </div>
                </div>`
                container.innerHTML += card
            })
        }

        // Zoom da imagem
        function zoomImage(src) {
            const modal = document.getElementById('zoom-modal')
            const img = document.getElementById('zoom-image')
            img.src = src
            modal.style.display = 'flex'
        }

        function closeZoom() {
            document.getElementById('zoom-modal').style.display = 'none'
        }

        // Alerta Personalizado
        function showCustomAlert() {
            document.getElementById('alert-modal').style.display = 'flex'
        }

        function closeAlert() {
            document.getElementById('alert-modal').style.display = 'none'
        }

        function finalizeOrder() {
            if (cart.length === 0) return
            
            showCustomAlert()  // Mostra o alerta personalizado
            
            let msg = `🚀 *PEDIDO PEGASUS REPRESENTAÇÕES*\n\n`
            let total = 0
            cart.forEach(item => {
                const sub = item.price * item.quantity
                total += sub
                msg += `${item.quantity}x ${item.name} → R$ ${sub},00\n`
            })
            msg += `\n*TOTAL: R$ ${total},00*`
            
            window.open(`https://wa.me/5527995065360?text=${encodeURIComponent(msg)}`, '_blank')
            
            cart = []
            updateCartCount()
            toggleCart()
        }

        // ... (resto das funções permanece igual: addToCart, renderCart, etc.)

        window.onload = () => {
            renderProducts(products)
            updateCartCount()
        }
    </script>
</body>
</html>
